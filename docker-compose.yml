services:
  backend:
    build: ./backend
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - vitalsync-net
    depends_on:
      - database

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - vitalsync-net
    depends_on:
      - backend

  database:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vitalsync-net

networks:
  vitalsync-net:
    driver: bridge

volumes:
  postgres-data:
